[package]
name = "tdesk-app"
description = "egui/eframe desktop trading terminal (paper trading)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tdesk-app"
path = "src/main.rs"

[lib]
name = "tdesk_app"
path = "src/lib.rs"

[features]
# Legacy eframe CI hook (EFRAME_SCREENSHOT_TO). On macOS the GL readback can
# be unreliable; use TDESK_CAPTURE / TDESK_CAPTURE_TO for documentation shots.
screenshot = ["eframe/__screenshot"]

[dependencies]
tdesk-core.workspace = true
tdesk-data.workspace = true
egui.workspace = true
eframe.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
