[package]
name = "tdesk-app"
description = "egui/eframe desktop trading terminal (paper trading)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tdesk-app"
path = "src/main.rs"

[lib]
name = "tdesk_app"
path = "src/lib.rs"

[features]
# Internal verification aid: EFRAME_SCREENSHOT_TO=<file.png> captures one
# frame and exits. Useful for CI / visual regression checks.
screenshot = ["eframe/__screenshot"]

[dependencies]
tdesk-core.workspace = true
tdesk-data.workspace = true
egui.workspace = true
eframe.workspace = true
